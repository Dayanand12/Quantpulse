<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>QuantPulse</title>

    <!-- Tailwind CDN -->
    <script src="https://cdn.tailwindcss.com"></script>

    <style>
        body { background-color: #0f0f0f; color: white; }
    </style>
</head>
<body class="h-screen flex">

    <!-- Sidebar -->
    <aside class="w-64 bg-gray-900 border-r border-gray-700 p-5">
        <h1 class="text-2xl font-bold mb-8 text-indigo-400">QuantPulse</h1>

        <nav class="space-y-3">
            <a href="/market-analysis">Market Analysis</a>
            <a href="/strategies" class="block px-4 py-2 rounded hover:bg-gray-800">Strategies</a>
            <a href="/orderbook" class="block px-4 py-2 rounded hover:bg-gray-800">Orderbook</a>
            <a href="/positions" class="block px-4 py-2 rounded hover:bg-gray-800">Positions</a>
            <a href="/trades" class="block px-4 py-2 rounded hover:bg-gray-800">Trades</a>
            <a href="/settings" class="block px-4 py-2 rounded hover:bg-gray-800">Settings</a>
            <a href="/stock-screener" class="block px-4 py-2 rounded hover:bg-gray-800">Stock Screener</a>
            <a href="/live" class="block py-2 px-4 hover:bg-gray-700 rounded">
    🔴 Live Trading
</a>
        </nav>
    </aside>

    <!-- Main Content -->
    <main class="flex-1 flex flex-col">
        
        <!-- Navbar -->
        <header class="h-14 flex items-center px-6 border-b border-gray-700 bg-gray-900">
            <h2 class="text-xl font-semibold">QuantPulse Trading Terminal</h2>
        </header>

        <!-- Page Content -->
        <section class="p-6 overflow-auto">
            {% block content %}{% endblock %}
        </section>
    </main>

</body>
</html>
