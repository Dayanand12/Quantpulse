<!DOCTYPE html>
<html>
<head>
    <title>Professional ORB Screener</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #0e0e0e;
            color: white;
            padding: 20px;
        }

        h2 {
            margin-bottom: 20px;
        }

        /* ===== BACK BUTTON ===== */
        .back-btn {
            background-color: #1f1f1f;
            color: white;
            border: 1px solid #333;
            padding: 8px 14px;
            margin-bottom: 20px;
            cursor: pointer;
            border-radius: 4px;
        }

        .back-btn:hover {
            background-color: #333;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        th, td {
            padding: 10px;
            text-align: center;
            border-bottom: 1px solid #222;
        }

        th {
            background-color: #1a1a1a;
        }

        tr:hover {
            background-color: #1f1f1f;
        }

        .stage1 { color: #f1c40f; }
        .stage2 { color: #e67e22; }
        .stage3 { color: #e74c3c; font-weight: bold; }

        .positive { color: #2ecc71; }
        .negative { color: #e74c3c; }
    </style>
</head>
<body>

<!-- ✅ BACK BUTTON -->
<button onclick="goBack()" class="back-btn">⬅ Back</button>

<h2>📊 Live ORB Professional Screener</h2>

<table>
    <thead>
        <tr>
            <th>Symbol</th>
            <th>Stage</th>
            <th>LTP</th>
            <th>VWAP</th>
            <th>RSI</th>
            <th>Volume Ratio</th>
            <th>ATR %</th>
            <th>OR Low</th>
            <th>Dist % to OR</th>
        </tr>
    </thead>
    <tbody id="screener-body"></tbody>
</table>

<script>
function goBack() {
    window.location.href = "/";
}

async function fetchScreener() {

    const res = await fetch("/api/screener-live");
    const data = await res.json();

    const tbody = document.getElementById("screener-body");
    tbody.innerHTML = "";

    data.forEach(stock => {

        let stageClass = "";
        if (stock.stage === "Stage 1") stageClass = "stage1";
        if (stock.stage === "Stage 2") stageClass = "stage2";
        if (stock.stage === "Stage 3") stageClass = "stage3";

        let distClass = "";
        if (stock.distance_to_or_low !== null) {
            distClass = stock.distance_to_or_low <= 0.2 ? "negative" : "positive";
        }

        const row = `
            <tr class="${stageClass}">
                <td>${stock.symbol}</td>
                <td>${stock.stage}</td>
                <td>${stock.ltp ? stock.ltp.toFixed(2) : "-"}</td>
                <td>${stock.vwap ? stock.vwap.toFixed(2) : "-"}</td>
                <td>${stock.rsi ? stock.rsi.toFixed(2) : "-"}</td>
                <td>${stock.volume_ratio ? stock.volume_ratio.toFixed(2) : "-"}</td>
                <td>${stock.atr_pct ? stock.atr_pct.toFixed(2) : "-"}</td>
                <td>${stock.orb_low ? stock.orb_low.toFixed(2) : "-"}</td>
                <td class="${distClass}">
                    ${stock.distance_to_or_low !== null 
                        ? stock.distance_to_or_low.toFixed(3) + "%"
                        : "-"}
                </td>
            </tr>
        `;

        tbody.innerHTML += row;
    });
}

setInterval(fetchScreener, 3000);
fetchScreener();
</script>

</body>
</html>
