<!DOCTYPE html>
<html>
<head>
    <title>Institutional Pre-Trade Dashboard</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #0e0e0e;
            color: white;
            padding: 20px;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        select, button {
            background: #1f1f1f;
            color: white;
            border: 1px solid #333;
            padding: 6px 12px;
            border-radius: 4px;
        }

        button:hover {
            background: #333;
            cursor: pointer;
        }

        .context-bar {
            margin-top: 20px;
            padding: 15px;
            background: #1a1a1a;
            border-radius: 6px;
            border: 1px solid #222;
        }

        .grid {
            margin-top: 25px;
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 20px;
        }

        .card {
            background: #1a1a1a;
            padding: 20px;
            border-radius: 6px;
            border: 1px solid #222;
        }

        .label {
            font-size: 12px;
            color: #aaa;
        }

        .value {
            font-size: 22px;
            font-weight: bold;
            margin-top: 5px;
        }

        .decision-box {
            margin-top: 30px;
            padding: 30px;
            text-align: center;
            font-size: 28px;
            font-weight: bold;
            border-radius: 6px;
        }

        .green { background: #1e3f2a; color: #2ecc71; }
        .yellow { background: #3f3a1e; color: #f1c40f; }
        .red { background: #3f1e1e; color: #e74c3c; }

        .progress-container {
            background: #222;
            border-radius: 20px;
            height: 25px;
            overflow: hidden;
            margin-top: 10px;
        }

        .progress-bar {
            height: 100%;
            width: 0%;
            text-align: center;
            line-height: 25px;
            font-weight: bold;
        }
    </style>
</head>
<body>

<div class="header">
    <div>
        <button onclick="window.location.href='/live'">⬅ Back</button>
        <select id="index-select">
            <option value="NIFTY 50">NIFTY</option>
            <option value="NIFTY BANK">BANKNIFTY</option>
        </select>
    </div>
    <h2>📊 Institutional Pre-Trade Dashboard</h2>
</div>

<div class="context-bar">
    Time: <span id="time">-</span>
</div>

<div class="grid">
    <div class="card">
        <div class="label">Regime</div>
        <div id="regime" class="value">-</div>
    </div>

    <div class="card">
        <div class="label">Trend Strength</div>
        <div id="trend" class="value">-</div>
    </div>

    <div class="card">
        <div class="label">Volatility State</div>
        <div id="volatility" class="value">-</div>
    </div>

    <div class="card">
        <div class="label">Confidence Score</div>
        <div class="progress-container">
            <div id="confidence-bar" class="progress-bar">0%</div>
        </div>
    </div>
</div>

<div id="decision-box" class="decision-box">-</div>

<script>
async function fetchMarket() {

    const symbol = document.getElementById("index-select").value;
    const res = await fetch(`/api/market-analysis?symbol=${symbol}`);
    const data = await res.json();

    if (data.error) return;

    document.getElementById("time").innerText = data.time;
    document.getElementById("regime").innerText = data.regime;
    document.getElementById("trend").innerText = data.trend_strength;
    document.getElementById("volatility").innerText = data.volatility_state;

    const score = data.confidence_score;
    const percent = (score / 10) * 100;

    const bar = document.getElementById("confidence-bar");
    bar.style.width = percent + "%";
    bar.innerText = percent.toFixed(0) + "%";

    if (percent >= 70)
        bar.style.background = "#2ecc71";
    else if (percent >= 40)
        bar.style.background = "#f1c40f";
    else
        bar.style.background = "#e74c3c";

    const decisionBox = document.getElementById("decision-box");
    decisionBox.innerText = data.decision;

    decisionBox.className = "decision-box";

    if (data.decision === "SELL NORMAL SIZE")
        decisionBox.classList.add("green");
    else if (data.decision === "SELL REDUCED SIZE")
        decisionBox.classList.add("yellow");
    else
        decisionBox.classList.add("red");
}

setInterval(fetchMarket, 3000);
fetchMarket();
</script>

</body>
</html>
