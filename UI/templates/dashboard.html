{% extends "base.html" %}

{% block content %}
<h1 class="text-2xl font-bold mb-4">Dashboard</h1>

<div class="grid grid-cols-3 gap-4">

    <!-- Live PnL -->
    <div class="bg-gray-800 p-6 rounded-lg shadow">
        <h3 class="text-lg mb-2">Live P&L</h3>
        <p id="live-pnl" class="text-4xl text-green-400 font-bold">0.00</p>
    </div>

    <!-- Strategy Signals -->
    <div class="bg-gray-800 p-6 rounded-lg shadow">
        <h3 class="text-lg mb-2">Strategy Signals</h3>
        <p class="text-gray-400">Signals will appear here…</p>
    </div>

    <!-- System Status -->
    <div class="bg-gray-800 p-6 rounded-lg shadow">
        <h3 class="text-lg mb-2">System Status</h3>
        <p class="text-green-400 font-semibold">Running</p>
    </div>

</div>

{% endblock %}
